name: Sync Docker Image

on:
  workflow_dispatch: # این گزینه اجازه می‌دهد دستی عملیات را شروع کنید

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull, Tag and Push
        run: |
          docker pull ghcr.io/sanaei/3x-ui:latest
          docker tag ghcr.io/sanaei/3x-ui:latest ${{ secrets.DOCKER_USERNAME }}/lib-core:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/lib-core:latest
