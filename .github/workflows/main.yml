name: Sync Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, Tag and Push
        run: |
          docker pull ghcr.io/mueez/3x-ui:latest
          docker tag ghcr.io/mueez/3x-ui:latest ${{ secrets.DOCKER_USERNAME }}/lib-core:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/lib-core:latest
